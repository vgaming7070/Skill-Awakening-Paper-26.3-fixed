
name: Build Skill Awakening Paper 26.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project
        id: findproject
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.github/*" \
            -not -path "./.gradle/*" \
            | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project found in repository!"
            echo "Upload build.gradle or settings.gradle and the plugin source files."
            exit 1
          fi

          echo "Found Gradle project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: gradle clean build --no-daemon
        working-directory: ${{ steps.findproject.outputs.project_dir }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillAwakening-Paper-26.3
          path: ${{ steps.findproject.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
