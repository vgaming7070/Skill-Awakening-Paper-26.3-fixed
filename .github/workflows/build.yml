
name: Build Skill Awakening

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name settings.gradle -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name build.gradle -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name build.gradle.kts -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No Gradle project found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skill-Awakening
          path: '**/build/libs/*.jar'
          if-no-files-found: error
