
name: Build Skill Awakening

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""
          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(find . -type f \( -name build.gradle -o -name build.gradle.kts \)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle project found!"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skill-Awakening
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            
